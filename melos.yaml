name: monorepo
repository: https://github.com/focustree/starknet.dart

packages:
  - examples/**
  - packages/**
  - contracts/v$CAIRO_VERSION/**

ignore:

command:
  bootstrap:
    runPubGetInParallel: true
  version:
    linkToCommits: true
    workspaceChangelog: true

scripts:
  validate-gh-actions:
    run: |
      action-validator .github/workflows/ci.yaml
  analyze:
    description: Analyze all packages
    exec: dart analyze --fatal-infos
  format:
    run: |
      dart pub global run flutter_plugin_tools format && swiftformat .
    description: |
      Formats the code of all packages (Java, Objective-C, and Dart).
       - Requires `flutter_plugin_tools` (`pub global activate flutter_plugin_tools`).
       - Requires `git`.
       - Requires `clang-format` (can be installed via Brew on MacOS).
       - Requires `swiftformat` (can be installed via Brew on macOS).
  format:check:
    description: Format check all packages
    exec: dart format --set-exit-if-changed .

  starknet:setup:
    description: Install starknet dev env (requires `source .env.devnet` first)
    run: |
      melos asdf:devnet
      melos asdf:scarb
      melos asdf:starknet-foundry

      asdf plugin add action-validator
      asdf install action-validator latest

      melos versions

  asdf:devnet:
    description: Install starknet devnet
    run: |
      (asdf plugin list | grep -q starknet-devnet) || asdf plugin add starknet-devnet
      (asdf list starknet-devnet | grep -q $STARKNET_DEVNET_VERSION) || asdf install starknet-devnet $STARKNET_DEVNET_VERSION
      (asdf set starknet-devnet $STARKNET_DEVNET_VERSION) || asdf local starknet-devnet $STARKNET_DEVNET_VERSION

  asdf:scarb:
    description: Install scarb
    run: |
      (asdf plugin list | grep -q scarb) || asdf plugin add scarb
      (asdf list scarb | grep -q $SCARB_VERSION) || asdf install scarb $SCARB_VERSION
      (asdf set scarb $SCARB_VERSION) || asdf local scarb $SCARB_VERSION

  asdf:starknet-foundry:
    description: Install starknet-foundry (sncast, snforge)
    run: |
      (asdf plugin list | grep -q starknet-foundry) || asdf plugin add starknet-foundry
      (asdf list starknet-foundry | grep -q $STARKNET_FOUNDRY_VERSION) || asdf install starknet-foundry $STARKNET_FOUNDRY_VERSION
      (asdf set starknet-foundry $STARKNET_FOUNDRY_VERSION) || asdf local starknet-foundry $STARKNET_FOUNDRY_VERSION

  versions:
    description: Display toolchain versions
    run: |
      echo "starknet-foundry: $(sncast --version)"
      scarb --version
      starknet-devnet --version

  devnet:start:
    description: Start local devnet
    run: |
      starknet-devnet --seed 0 --dump-path $DEVNET_DUMP_PATH --state-archive-capacity full --port 5050
  devnet:start:dump:
    description: Start local devnet from scratch and dump on exit
    run: |
      rm $DEVNET_DUMP_PATH
      starknet-devnet --seed 0 --dump-path $DEVNET_DUMP_PATH --state-archive-capacity full --dump-on exit --port 5050
  devnet:setup:
    description: Setup local devnet (requires `source .env.devnet` first)
    run: |
      melos sncast:account:import
      melos contracts:build
      melos contracts:declare
      melos contracts:deploy
      melos contracts:invoke
      melos contracts:argent:declare

  sncast:account:import:
    description: Import devnet account into sncast accounts file
    run: |
      sncast account import \
        --name $SNCAST_ACCOUNT \
        --address $STARKNET_ACCOUNT_ADDRESS \
        --private-key $STARKNET_PRIVATE_KEY \
        --type oz \
        --url $STARKNET_RPC \
        --silent 2>&1 || true

  contracts:build:
    description: Build cairo contracts
    run: |
      cd contracts/v$CAIRO_VERSION
      scarb build
  contracts:declare:
    description: Declare cairo contracts
    run: |
      cd contracts/v$CAIRO_VERSION
      sncast --account $SNCAST_ACCOUNT declare --contract-name hello --url $STARKNET_RPC 2>&1
  contracts:deploy:
    description: Deploy cairo contracts
    run: |
      cd contracts/v$CAIRO_VERSION
      sncast --account $SNCAST_ACCOUNT deploy --class-hash $HELLO_CLASS_HASH --salt $SALT --arguments '0' --url $STARKNET_RPC 2>&1
  contracts:check:
    description: Check cairo contracts
    run: |
      cd contracts/v$CAIRO_VERSION
      asdf install scarb $SCARB_VERSION
      scarb check

  contracts:invoke:
    description: Invoke hello contract set_name
    run: |
      sncast --account $SNCAST_ACCOUNT invoke --contract-address $HELLO_CONTRACT_ADDRESS --function set_name --arguments '0x49276d2068657265' --url $STARKNET_RPC 2>&1

  contracts:token:declare:
    description: declare the ERC20 contract
    run: |
      cd contracts/v$CAIRO_VERSION
      sncast --account $SNCAST_ACCOUNT declare --contract-name MyToken --url $STARKNET_RPC 2>&1
  contracts:token:deploy:
    description: deploy the ERC20 contract
    run: |
      cd contracts/v$CAIRO_VERSION
      sncast --account $SNCAST_ACCOUNT deploy --class-hash 0x07d4ee0e4494fe12b26da8e7d2cb114185f768f2bce3e7b1b356cecc9596474b --salt 0x12345678 --arguments '1000000000000000000000000000, 0x64b48806902a367c8598f4f95c305e8c1a1acba5f082d294a43793113115691' --url $STARKNET_RPC 2>&1

  contracts:argent:declare:
    description: declare the Argent contract
    run: |
      sncast --account $SNCAST_ACCOUNT --accounts-file .starknet_accounts/starknet_open_zeppelin_accounts.json declare-from --sierra-file contracts/argent/v0.4.0/argent_ArgentAccount.contract_class.json --url $STARKNET_RPC 2>&1

  test:
    description: Run all tests
    steps:
      - melos test:dart:unit
      - melos test:dart:integration
  test:dart:unit:
    description: Run all dart unit tests
    run: melos exec --dir-exists="test" -- dart test --tags unit --fail-fast
    packageFilters:
      ignore: "*starknet_builder*"
      flutter: false
  test:dart:integration:
    description: Run all dart integration tests
    run: melos exec -c 1 --dir-exists="test" -- dart test --tags integration --fail-fast
    packageFilters:
      ignore: "*starknet_builder*"
      flutter: false

  publish:dry-run:
    description: Publish dry-run all packages
    exec: dart pub publish --dry-run
    packageFilters:
      noPrivate: true

  upgrade:dart:
    name: Upgrade Dart package deps
    exec: dart pub upgrade
    packageFilters:
      flutter: false
  upgrade:flutter:
    name: Upgrade Flutter package deps
    exec: flutter pub upgrade
    packageFilters:
      flutter: true
